<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Telescopio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  :root{
    --blu-notte:#070c26; --blu-p:#0a1230; --azz:#8ab4ff; --azz-t:#5a7bb5;
    --verde:#22dd66; --ambra:#ffb038; --card:#0f1938; --bordo:rgba(120,160,230,0.35);
  }
  html,body{background:#000;overflow:hidden;height:100%;position:fixed;width:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#dce8ff;}
  #cielo{display:block;width:100vw;height:100vh;touch-action:none;position:absolute;top:0;left:0;}

  /* Barra superiore */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:15;
    padding:calc(env(safe-area-inset-top,0) + 10px) 14px 10px;
    background:linear-gradient(rgba(5,10,28,0.75),rgba(5,10,28,0));
    display:flex;justify-content:space-between;align-items:center;pointer-events:none;}
  .topbar .info{font-family:'SF Mono',ui-monospace,monospace;font-size:12px;color:var(--azz-t);}
  .topbar .tit{font-weight:600;color:#cde;font-size:14px;}

  /* Barra inferiore con i pulsanti principali */
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:15;
    padding:10px 12px calc(env(safe-area-inset-bottom,0) + 12px);
    background:linear-gradient(rgba(5,10,28,0),rgba(5,10,28,0.85));
    display:flex;justify-content:space-around;align-items:center;gap:8px;}
  .navbtn{flex:1;background:rgba(20,32,64,0.7);border:1px solid var(--bordo);
    border-radius:14px;padding:11px 4px;color:var(--azz);font-size:11px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:4px;backdrop-filter:blur(8px);}
  .navbtn:active{background:rgba(40,60,110,0.8);}
  .navbtn .ic{font-size:20px;line-height:1;}
  .navbtn.att{background:rgba(50,80,160,0.85);border-color:var(--azz);color:#fff;}

  /* Pulsante bussola (riaggancia al telescopio) */
  #btnBussola{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0) + 96px);
    z-index:16;width:52px;height:52px;border-radius:50%;background:rgba(20,32,64,0.85);
    border:1px solid var(--bordo);color:var(--ambra);font-size:24px;display:none;
    align-items:center;justify-content:center;backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(0,0,0,0.4);}
  #btnBussola.mostra{display:flex;}
  #btnBussola.attivo{color:var(--verde);border-color:var(--verde);}

  #btnStopPunta{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0) + 96px);z-index:16;
    background:rgba(120,40,40,0.85);border:1px solid rgba(220,120,120,0.6);
    color:#fcc;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;
    display:none;align-items:center;gap:6px;backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(0,0,0,0.4);}
  #btnStopPunta.mostra{display:flex;}
  #btnStopPunta span{font-weight:400;}

  /* Pannello a scomparsa (liste, info) */
  .pannello{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:80vh;
    background:linear-gradient(180deg,rgba(16,26,58,0.98),rgba(8,14,35,0.99));
    border-top:1px solid var(--bordo);border-radius:22px 22px 0 0;
    padding:16px 16px calc(env(safe-area-inset-bottom,0) + 20px);
    transform:translateY(110%);transition:transform 0.35s cubic-bezier(0.3,0.8,0.3,1);
    box-shadow:0 -8px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column;}
  .pannello.aperto{transform:translateY(0);}
  .pannello .grip{width:40px;height:4px;background:rgba(150,180,230,0.4);border-radius:2px;
    margin:0 auto 14px;flex-shrink:0;}
  .pannello h3{font-size:17px;margin-bottom:12px;color:#cde;flex-shrink:0;}
  .chiudi{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,0.1);color:#cde;border:none;font-size:18px;}

  /* Categorie a griglia */
  .categorie{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .cat{background:rgba(255,255,255,0.06);border:1px solid var(--bordo);border-radius:14px;
    padding:16px 8px;text-align:center;}
  .cat:active{background:rgba(80,120,200,0.3);}
  .cat .ic{font-size:26px;}
  .cat .nome{font-size:12px;margin-top:6px;color:#bcd;}
  .cat .conta{font-size:10px;color:var(--azz-t);margin-top:2px;}

  /* Ricerca */
  .cerca{width:100%;background:rgba(10,18,40,0.8);border:1px solid var(--bordo);border-radius:12px;
    padding:12px 14px;color:#dce8ff;font-size:15px;font-family:inherit;margin-bottom:10px;flex-shrink:0;}
  .cerca::placeholder{color:var(--azz-t);}

  /* Lista risultati */
  .lista{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .voce{padding:13px 12px;border-bottom:1px solid rgba(120,160,230,0.12);
    display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .voce:active{background:rgba(80,120,200,0.2);}
  .voce .n{font-size:15px;color:#dce8ff;}
  .voce.nonvis .n{color:#5a6a85;}  /* non visibile: tenue */
  .voce .meta{font-size:11px;color:var(--azz-t);text-align:right;flex-shrink:0;}
  .voce .pall{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .sez{font-size:11px;color:var(--azz-t);text-transform:uppercase;letter-spacing:1px;
    padding:10px 12px 4px;position:sticky;top:0;background:rgba(12,20,44,0.95);}

  /* Scheda oggetto */
  .scheda .head{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .scheda .pall{width:18px;height:18px;border-radius:50%;box-shadow:0 0 12px currentColor;}
  .scheda .nome{font-size:24px;font-weight:700;}
  .scheda .sotto{color:var(--azz-t);font-size:13px;margin-bottom:14px;}
  .scheda .griglia{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .scheda .box{background:rgba(255,255,255,0.05);border-radius:12px;padding:10px 12px;}
  .scheda .box.full{grid-column:1/3;}
  .scheda .et{font-size:10px;color:var(--azz-t);text-transform:uppercase;letter-spacing:0.5px;}
  .scheda .val{font-size:15px;margin-top:3px;line-height:1.4;}
  .scheda .azioni{display:flex;gap:10px;margin-top:16px;}
  .scheda .azioni button{flex:1;background:rgba(50,80,160,0.85);border:1px solid var(--azz);
    color:#fff;border-radius:12px;padding:13px;font-size:14px;font-family:inherit;font-weight:600;}
  .scheda .azioni button:active{background:rgba(70,110,200,0.9);}

  .hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0) + 90px);left:50%;
    transform:translateX(-50%);z-index:14;color:var(--azz-t);font-size:11px;
    font-family:monospace;background:rgba(5,15,35,0.6);padding:6px 14px;border-radius:16px;
    border:1px solid rgba(100,140,190,0.25);transition:opacity 0.5s;pointer-events:none;}

  .nascosto{display:none!important;}
</style>
</head>
<body>
<canvas id="cielo"></canvas>

<div class="topbar">
  <span class="tit">Telescopio</span>
  <span class="info" id="coordInfo">--</span>
</div>

<div id="btnBussola" onclick="riaggancia()">◎</div>
<div id="btnStopPunta" onclick="stopPuntamento()">✕ <span>stop</span></div>
<div class="hint" id="hint">trascina per esplorare · pizzica per zoom</div>

<div class="navbar">
  <div class="navbtn" onclick="apriCategorie()"><span class="ic">🔍</span>Cerca</div>
  <div class="navbtn" onclick="apriAllinea()"><span class="ic">🎯</span>Allinea</div>
  <div class="navbtn" onclick="apriSetup()"><span class="ic">⚙️</span>Setup</div>
</div>

<!-- Pannello categorie/ricerca -->
<div class="pannello" id="panCat">
  <div class="grip"></div>
  <button class="chiudi" onclick="chiudiPannelli()">×</button>
  <input class="cerca" id="cercaGlobale" placeholder="cerca in tutto il cielo...">
  <div id="catGriglia" class="categorie"></div>
  <div id="catLista" class="lista nascosto"></div>
</div>

<!-- Pannello scheda oggetto -->
<div class="pannello" id="panScheda">
  <div class="grip"></div>
  <button class="chiudi" onclick="chiudiPannelli()">×</button>
  <div class="scheda" id="schedaBody"></div>
</div>

<!-- Pannello allinea -->
<div class="pannello" id="panAllinea">
  <div class="grip"></div>
  <button class="chiudi" onclick="chiudiPannelli()">×</button>
  <h3>Allineamento bussola</h3>
  <input class="cerca" id="cercaAllinea" placeholder="cerca oggetto da allineare...">
  <div id="listaAllinea" class="lista"></div>
</div>

<!-- Pannello setup -->
<div class="pannello" id="panSetup">
  <div class="grip"></div>
  <button class="chiudi" onclick="chiudiPannelli()">×</button>
  <h3>Impostazioni</h3>
  <div class="lista" id="setupBody"></div>
</div>

<script>
/* ============================================================
   SGP4 semplificato per calcolo posizione satelliti da TLE
   Basato sul modello SGP4 standard. Sufficiente per puntamento
   visuale (precisione ~pochi km / frazioni di grado).
   ============================================================ */
const SGP4 = (function(){
  const DEG=Math.PI/180, TWOPI=2*Math.PI, MINPD=1440;
  const XKE=0.0743669161331734, CK2=5.413080e-4, AE=1.0, ER=6378.137;
  const J2=1.082616e-3, MU=398600.8;

  function parseTLE(l1, l2){
    // estrae elementi dal TLE (due righe)
    const epochYear = parseInt(l1.substring(18,20));
    const epochDay = parseFloat(l1.substring(20,32));
    const year = epochYear<57 ? 2000+epochYear : 1900+epochYear;
    const inclo = parseFloat(l2.substring(8,16))*DEG;
    const nodeo = parseFloat(l2.substring(17,25))*DEG;
    const ecco = parseFloat("0."+l2.substring(26,33).trim());
    const argpo = parseFloat(l2.substring(34,42))*DEG;
    const mo = parseFloat(l2.substring(43,51))*DEG;
    const no = parseFloat(l2.substring(52,63));  // rivoluzioni/giorno
    return {year, epochDay, inclo, nodeo, ecco, argpo, mo, no};
  }

  // giorno giuliano da anno + giorno frazionario
  function jdFromEpoch(year, day){
    const jan1 = jday(year,1,1,0,0,0);
    return jan1 + day - 1;
  }
  function jday(yr,mon,dy,hr,min,sec){
    return 367*yr - Math.floor(7*(yr+Math.floor((mon+9)/12))/4)
      + Math.floor(275*mon/9) + dy + 1721013.5
      + ((sec/60+min)/60+hr)/24;
  }

  // GMST da JD
  function gmst(jd){
    const T=(jd-2451545.0)/36525;
    let g=280.46061837+360.98564736629*(jd-2451545.0)+0.000387933*T*T-T*T*T/38710000;
    g=g%360; if(g<0)g+=360; return g*DEG;
  }

  // risolve la posizione ECI (semplificato, no perturbazioni profonde)
  function propagate(el, jdTarget){
    const jdEpoch = jdFromEpoch(el.year, el.epochDay);
    const tmin = (jdTarget - jdEpoch)*MINPD;  // minuti dall'epoca

    const n0 = el.no*TWOPI/MINPD;  // rad/min
    const a0 = Math.pow(MU/(n0*n0*ER*ER*ER),1/3); // in raggi terrestri? -> uso km
    const a = Math.pow(MU/((el.no*TWOPI/86400)*(el.no*TWOPI/86400)),1/3); // km, semiasse

    const e=el.ecco, i=el.inclo;
    // perturbazioni secolari J2 (nodo e perigeo)
    const p = a*(1-e*e);
    const factor = 1.5*J2*(ER/p)*(ER/p)*(el.no*TWOPI/86400);
    const nodeDot = -factor*Math.cos(i);
    const argpDot = factor*(2-2.5*Math.sin(i)*Math.sin(i));

    const tsec = tmin*60;
    const node = el.nodeo + nodeDot*tsec;
    const argp = el.argpo + argpDot*tsec;
    const M = el.mo + (el.no*TWOPI/86400)*tsec;

    // Keplero
    let E=M;
    for(let k=0;k<10;k++){ E = E - (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E)); }
    const xv=a*(Math.cos(E)-e), yv=a*Math.sqrt(1-e*e)*Math.sin(E);
    const r=Math.sqrt(xv*xv+yv*yv);
    const nu=Math.atan2(yv,xv);
    const u=nu+argp;
    // posizione ECI
    const cosN=Math.cos(node), sinN=Math.sin(node);
    const cosI=Math.cos(i), sinI=Math.sin(i);
    const cosU=Math.cos(u), sinU=Math.sin(u);
    const x=r*(cosN*cosU - sinN*sinU*cosI);
    const y=r*(sinN*cosU + cosN*sinU*cosI);
    const z=r*(sinU*sinI);
    return {x,y,z};
  }

  // da ECI a Alt/Az per osservatore (lat,lon in gradi)
  function eciToAltAz(eci, jd, latDeg, lonDeg){
    const theta = gmst(jd) + lonDeg*DEG;  // local sidereal
    const lat=latDeg*DEG;
    // posizione osservatore ECI
    const Re=ER;
    const obs={x:Re*Math.cos(lat)*Math.cos(theta), y:Re*Math.cos(lat)*Math.sin(theta), z:Re*Math.sin(lat)};
    // vettore range
    const rx=eci.x-obs.x, ry=eci.y-obs.y, rz=eci.z-obs.z;
    // rotazione in topocentrico (SEZ)
    const sinLat=Math.sin(lat), cosLat=Math.cos(lat);
    const sinTh=Math.sin(theta), cosTh=Math.cos(theta);
    const south = sinLat*cosTh*rx + sinLat*sinTh*ry - cosLat*rz;
    const east  = -sinTh*rx + cosTh*ry;
    const zed   = cosLat*cosTh*rx + cosLat*sinTh*ry + sinLat*rz;
    const rangeSat=Math.sqrt(rx*rx+ry*ry+rz*rz);
    const el=Math.asin(zed/rangeSat);
    let az=Math.atan2(east, -south);
    az=az%TWOPI; if(az<0)az+=TWOPI;
    return {alt:el/DEG, az:az/DEG, range:rangeSat};
  }

  return {
    parseTLE,
    // API principale: da TLE (2 righe) + ora + osservatore -> {alt,az}
    posizione: function(l1,l2,latDeg,lonDeg,date){
      const el=parseTLE(l1,l2);
      const d=date||new Date();
      const jd=d.getTime()/86400000+2440587.5;
      const eci=propagate(el,jd);
      return eciToAltAz(eci,jd,latDeg,lonDeg);
    }
  };

// ---------- ASTRONOMIA ----------
function jd(){return Date.now()/86400000+2440587.5;}
function lst(){const j=jd(),T=(j-2451545)/36525;
  let g=280.46061837+360.98564736629*(j-2451545)+0.000387933*T*T-T*T*T/38710000;
  return n360(g+lon);}
function eqAA(arOre,decG){
  if(lat==null) return {alt:0,az:0};
  const ha=n360(lst()-arOre*15)*D2R, dec=decG*D2R, la=lat*D2R;
  const alt=Math.asin(Math.sin(dec)*Math.sin(la)+Math.cos(dec)*Math.cos(la)*Math.cos(ha));
  let az=Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(la)-Math.tan(dec)*Math.cos(la));
  return {alt:alt*R2D, az:n360(az*R2D+180)};
}
// pianeti (Schlyter)
function pSole(d){const w=282.9404+4.70935e-5*d,e=0.016709-1.151e-9*d;
  const M=rev(356.0470+0.9856002585*d),Mr=M*D2R;
  let E=M+e*R2D*Math.sin(Mr)*(1+e*Math.cos(Mr));const Er=E*D2R;
  const xv=Math.cos(Er)-e,yv=Math.sqrt(1-e*e)*Math.sin(Er);
  const v=rev(Math.atan2(yv,xv)*R2D),r=Math.sqrt(xv*xv+yv*yv);
  const ls=rev(v+w),lr=ls*D2R,ecl=(23.4393-3.563e-7*d)*D2R;
  const xs=r*Math.cos(lr),ys=r*Math.sin(lr);
  return{x:xs,y:ys*Math.cos(ecl),z:ys*Math.sin(ecl),r,lon:ls};}

function pPianeta(nome,d,sole){const p=ELEM[nome](d),e=p.e;
  let E=p.M+R2D*e*Math.sin(p.M*D2R)*(1+e*Math.cos(p.M*D2R));
  for(let k=0;k<6;k++){const Er=E*D2R;E=E-(E-R2D*e*Math.sin(Er)-p.M)/(1-e*Math.cos(Er));}
  const Er=E*D2R,xv=p.a*(Math.cos(Er)-e),yv=p.a*Math.sqrt(1-e*e)*Math.sin(Er);
  const v=rev(Math.atan2(yv,xv)*R2D),r=Math.sqrt(xv*xv+yv*yv);
  const N=p.N*D2R,i=p.i*D2R,w=p.w*D2R,vr=v*D2R;
  const xh=r*(Math.cos(N)*Math.cos(vr+w)-Math.sin(N)*Math.sin(vr+w)*Math.cos(i));
  const yh=r*(Math.sin(N)*Math.cos(vr+w)+Math.cos(N)*Math.sin(vr+w)*Math.cos(i));
  const zh=r*Math.sin(vr+w)*Math.sin(i);
  const lr=sole.lon*D2R,rs=sole.r,xs=rs*Math.cos(lr),ys=rs*Math.sin(lr);
  let xg=xh+xs,yg=yh+ys,zg=zh;const ecl=(23.4393-3.563e-7*d)*D2R;
  const xe=xg,ye=yg*Math.cos(ecl)-zg*Math.sin(ecl),ze=yg*Math.sin(ecl)+zg*Math.cos(ecl);
  return{ar:rev(Math.atan2(ye,xe)*R2D)/15,dec:Math.atan2(ze,Math.sqrt(xe*xe+ye*ye))*R2D};}
function pLuna(d){const N=rev(125.1228-0.0529538083*d),i=5.1454,w=rev(318.0634+0.1643573223*d);
  const a=60.2666,e=0.0549,M=rev(115.3654+13.0649929509*d);
  let E=M+R2D*e*Math.sin(M*D2R)*(1+e*Math.cos(M*D2R));
  for(let k=0;k<6;k++){const Er=E*D2R;E=E-(E-R2D*e*Math.sin(Er)-M)/(1-e*Math.cos(Er));}
  const Er=E*D2R,xv=a*(Math.cos(Er)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(Er);
  const v=rev(Math.atan2(yv,xv)*R2D),r=Math.sqrt(xv*xv+yv*yv);
  const Nr=N*D2R,ir=i*D2R,wr=w*D2R,vr=v*D2R;
  const xh=r*(Math.cos(Nr)*Math.cos(vr+wr)-Math.sin(Nr)*Math.sin(vr+wr)*Math.cos(ir));
  const yh=r*(Math.sin(Nr)*Math.cos(vr+wr)+Math.cos(Nr)*Math.sin(vr+wr)*Math.cos(ir));
  const zh=r*Math.sin(vr+wr)*Math.sin(ir);const ecl=(23.4393-3.563e-7*d)*D2R;
  const xe=xh,ye=yh*Math.cos(ecl)-zh*Math.sin(ecl),ze=yh*Math.sin(ecl)+zh*Math.cos(ecl);
  return{ar:rev(Math.atan2(ye,xe)*R2D)/15,dec:Math.atan2(ze,Math.sqrt(xe*xe+ye*ye))*R2D};}

// AR/Dec di un pianeta per nome
function eqPianeta(nome){
  const j=jd(),d=j-2451543.5;
  if(nome==="Sole"){const s=pSole(d);return{ar:rev(Math.atan2(s.y,s.x)*R2D)/15,dec:Math.atan2(s.z,Math.sqrt(s.x*s.x+s.y*s.y))*R2D};}
  if(nome==="Luna")return pLuna(d);
  if(ELEM[nome])return pPianeta(nome,d,pSole(d));
  return null;
}

// ---------- VISIBILITA' ----------

function visibileOra(ar,dec){
  const aa=eqAA(ar,dec);
  return aa.alt>0;
}

// ---------- CALCOLO POSIZIONE DI QUALSIASI OGGETTO ----------
// ritorna {ar,dec} o null
function eqOggetto(o){
  if(o.tipo==="pianeta") return eqPianeta(o.nome);
  if(o.tipo==="satellite" && o.calcPos){ const r=o.calcPos(); return r; }
  return {ar:o.ar, dec:o.dec};
}
function altAzOggetto(o){
  const e=eqOggetto(o); if(!e) return null;
  // i satelliti restituiscono già alt/az (non ar/dec)
  if(e.satAltAz) return {alt:e.satAltAz.alt, az:e.satAltAz.az};
  return eqAA(e.ar, e.dec);
}

// ---------- COLORE STELLA da B-V ----------
function coloreStella(ci){
  let r,g,b;
  if(ci<-0.1){r=170;g=200;b=255;}
  else if(ci<0.3){r=210;g=225;b=255;}
  else if(ci<0.6){r=255;g=250;b=240;}
  else if(ci<1.0){r=255;g=235;b=190;}
  else{r=255;g=200;b=155;}
  return[r,g,b];
}

// ============================================================
//   SENSORI - orientamento del telescopio
//   Ora: sensori telefono. Futuro: dati ESP32 via WebSocket.
//   La funzione impostaOrientamento() e' il punto d'ingresso
//   unico: sia il telefono sia l'ESP32 la chiameranno.
// ============================================================
let lettoSensore=false, haAssoluto=false;
let ultimoMovimento=0;  // per rilevare quando il telescopio si muove

function filtroAng(v,nv,p){if(v==null)return nv;let df=nv-v;while(df>180)df-=360;while(df<-180)df+=360;return n360(v+p*df);}
function filtroLin(v,nv,p){if(v==null)return nv;return v+p*(nv-v);}

// PUNTO D'INGRESSO UNICO per l'orientamento (telefono o ESP32)
function impostaOrientamento(azGrezzo, altGrezzo){
  const azPrec=azF, altPrec=altF;
  if(azGrezzo!=null) azF=filtroAng(azF,azGrezzo,ALPHA);
  if(altGrezzo!=null) altF=filtroLin(altF,altGrezzo,ALPHA);
  // applico calibrazione
  if(azF!=null) scopeAz=n360(azF*guadAz+offAz);
  if(altF!=null) scopeAlt=altF+offAlt;
  // rilevo movimento del telescopio (per il riaggancio automatico)
  if(azPrec!=null){
    let d=Math.abs(azF-azPrec)+Math.abs((altF||0)-(altPrec||0));
    if(d>0.8){ ultimoMovimento=Date.now();
      // se il telescopio si muove e non stiamo esplorando da poco, riaggancia
      if(!seguiTelescopio && Date.now()-ultimoTouch>2500){ seguiTelescopio=true; aggiornaBussola(); }
    }
  }
  // se seguiamo il telescopio, la vista = orientamento telescopio
  if(seguiTelescopio && scopeAz!=null){ viewAz=scopeAz; viewAlt=scopeAlt; }
}

// --- sensori TELEFONO (versione attuale) ---
function orientDaTelefono(ev){
  let az=null;
  if(typeof ev.webkitCompassHeading==="number") az=ev.webkitCompassHeading;
  else if(ev.alpha!=null) az=n360(360-ev.alpha);
  let alt=(ev.beta!=null)?ev.beta:null;
  impostaOrientamento(az,alt);
}
function hAss(ev){lettoSensore=true;haAssoluto=true;orientDaTelefono(ev);}
function hRel(ev){lettoSensore=true;if(haAssoluto)return;orientDaTelefono(ev);}
function attivaSensoriTelefono(){
  window.addEventListener("deviceorientationabsolute",hAss,true);
  window.addEventListener("deviceorientation",hRel,true);
}

// --- GPS ---
function chiediGPS(cb){
  if(!navigator.geolocation){if(cb)cb(false);return;}
  navigator.geolocation.getCurrentPosition(
    p=>{lat=p.coords.latitude;lon=p.coords.longitude;
        try{localStorage.setItem("pos",JSON.stringify([lat,lon]));}catch(e){}
        if(cb)cb(true);},
    e=>{ // fallback: ultima posizione salvata
        try{const s=localStorage.getItem("pos");if(s){const a=JSON.parse(s);lat=a[0];lon=a[1];if(cb)cb(true);return;}}catch(e2){}
        if(cb)cb(false);},
    {enableHighAccuracy:true,timeout:8000,maximumAge:300000});
}

// ============================================================
//   VISTA CIELO - canvas, proiezione a cupola immersiva
// ============================================================
const cv=document.getElementById("cielo"), ctx=cv.getContext("2d");
let W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();

function proietta(az,alt){
  const a=az*D2R,e=alt*D2R,ca=viewAz*D2R,ce=viewAlt*D2R;
  const x=Math.cos(e)*Math.sin(a-ca);
  const y=Math.cos(ce)*Math.sin(e)-Math.sin(ce)*Math.cos(e)*Math.cos(a-ca);
  const z=Math.sin(ce)*Math.sin(e)+Math.cos(ce)*Math.cos(e)*Math.cos(a-ca);
  if(z<0.06)return null;
  const s=H/(campo*D2R);
  const d=Math.sqrt(x*x+y*y);
  const ang=Math.atan2(d,z);
  const rp=Math.tan(ang*0.82)/(d||1);
  return{x:W/2+x*rp*s,y:H/2-y*rp*s,z,ang};
}

let stelleSchermo=[], nomiCostSchermo=[];

function disegna(){
  // cielo blu notte con gradiente
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#05081c");g.addColorStop(0.55,"#070c26");
  g.addColorStop(0.85,"#0a1230");g.addColorStop(1,"#0c1638");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  if(lat==null||viewAz==null){
    ctx.fillStyle="#5a7bb5";ctx.font="15px sans-serif";ctx.textAlign="center";
    ctx.fillText("attendo posizione e sensori...",W/2,H/2);ctx.textAlign="left";
    return;
  }

  disegnaViaLattea();
  disegnaCostellazioni();
  disegnaNomiCost();
  disegnaStelle();
  disegnaMessier();
  disegnaPianeti();
  disegnaSatelliti();
  disegnaOrizzonte();
  if(oggettoTarget) disegnaFrecciaTarget();
}

function disegnaViaLattea(){
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(let i=0;i<80;i++){
    const ar=(i/80)*24, dc=Math.sin((ar/24)*6.28)*22+27*Math.cos((ar/24)*6.28);
    const aa=eqAA(ar,dc);if(aa.alt<0)continue;
    const p=proietta(aa.az,aa.alt);if(!p)continue;
    const r=70/p.z;
    const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    gr.addColorStop(0,"rgba(150,170,220,0.045)");gr.addColorStop(1,"rgba(150,170,220,0)");
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
  }
  ctx.restore();
}

function disegnaCostellazioni(){
  ctx.save();ctx.globalCompositeOperation="lighter";ctx.lineWidth=1.1;ctx.lineCap="round";
  for(const c of COST_LINEE){
    for(const seg of c.l){
      let prev=null;
      for(const pt of seg){
        const aa=eqAA(pt[0],pt[1]);
        const p=proietta(aa.az,aa.alt);
        if(p&&p.x>-60&&p.x<W+60&&p.y>-60&&p.y<H+60){
          if(prev){
            const gr=ctx.createLinearGradient(prev.x,prev.y,p.x,p.y);
            gr.addColorStop(0,"rgba(90,140,220,0.28)");
            gr.addColorStop(0.5,"rgba(120,170,240,0.4)");
            gr.addColorStop(1,"rgba(90,140,220,0.28)");
            ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();
          }
          prev=p;
        }else prev=null;
      }
    }
  }
  ctx.restore();
}

function disegnaNomiCost(){
  nomiCostSchermo=[];
  ctx.save();ctx.font="italic 13px -apple-system,sans-serif";ctx.textAlign="center";
  for(const id in COST_INFO){
    const c=COST_INFO[id];
    const aa=eqAA(c.ra,c.dec);
    const p=proietta(aa.az,aa.alt);
    if(!p||p.x<24||p.x>W-24||p.y<34||p.y>H-24)continue;
    ctx.fillStyle="rgba(150,180,235,0.45)";
    ctx.fillText(c.it.toUpperCase(),p.x,p.y);
    nomiCostSchermo.push({x:p.x,y:p.y,id});
  }
  ctx.restore();ctx.textAlign="left";
}


// magnitudine limite automatica in base allo zoom (campo visivo)
// vista larga = poche stelle luminose; zoom stretto = compaiono le deboli
function magLimiteAuto(){
  // campo 110° -> 3.8 ; campo 60° -> 5.0 ; campo 30° -> 6.5 ; campo 12° -> 8.0
  const m = 9.2 - 2.35*Math.log10(campo);
  // rispetto comunque il tetto scelto dall'utente (limiteMag = massimo assoluto)
  return Math.min(m, limiteMag + limiteMagBonus);
}

function disegnaStelle(){
  stelleSchermo=[];
  const magLim=magLimiteAuto();
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(const s of (STELLE_EXTRA||STELLE)){
    if(s[2]>magLim)continue;
    const aa=eqAA(s[0],s[1]);  // niente taglio orizzonte: vista 360°
    const p=proietta(aa.az,aa.alt);
    if(!p||p.x<-30||p.x>W+30||p.y<-30||p.y>H+30)continue;
    const[cr,cg,cb]=coloreStella(s[3]!=null?s[3]:0.5);
    const raggio=Math.max(0.7,(4.8-s[2])*0.82)*Math.pow(75/campo,0.35);
    const aR=raggio*(s[2]<2?4.5:3.2);
    const gg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,aR);
    gg.addColorStop(0,`rgba(${cr},${cg},${cb},0.85)`);
    gg.addColorStop(0.28,`rgba(${cr},${cg},${cb},0.32)`);
    gg.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p.x,p.y,aR,0,7);ctx.fill();
    ctx.fillStyle=`rgb(${cr},${cg},${cb})`;ctx.beginPath();ctx.arc(p.x,p.y,raggio,0,7);ctx.fill();
    if(s[4]) stelleSchermo.push({x:p.x,y:p.y,s});
  }
  ctx.restore();
  // nomi stelle brillanti
  ctx.fillStyle="rgba(200,215,245,0.6)";ctx.font="12px -apple-system,sans-serif";
  for(const ss of stelleSchermo){ if(ss.s[4]&&ss.s[2]<1.7) ctx.fillText(ss.s[4],ss.x+8,ss.y-6); }
}

function disegnaMessier(){
  const arr=NGC||MESSIER.map(m=>[m[0],m[1],m[2],m[3],m[4]]);
  ctx.save();
  for(const o of arr){
    if(o[2]>limiteMag+3)continue;
    const aa=eqAA(o[0],o[1]);
    const p=proietta(aa.az,aa.alt);
    if(!p||p.x<0||p.x>W||p.y<0||p.y>H)continue;
    ctx.strokeStyle="rgba(120,200,180,0.7)";ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(p.x,p.y,4,3,0,0,7);ctx.stroke();
    if(campo<50){ctx.fillStyle="rgba(120,200,180,0.6)";ctx.font="9px monospace";
      ctx.fillText(o[3],p.x+6,p.y+3);}
  }
  ctx.restore();
}

function disegnaPianeti(){
  for(const n of PIANETI){
    const e=eqPianeta(n);if(!e)continue;
    const aa=eqAA(e.ar,e.dec);
    const p=proietta(aa.az,aa.alt);if(!p||p.x<0||p.x>W||p.y<0||p.y>H)continue;
    const col=n==="Sole"?"#ffdd44":n==="Luna"?"#e8e8e8":n==="Marte"?"#ff7744":
              n==="Giove"?"#ffcc88":n==="Saturno"?"#ffdda0":"#aaccff";
    const rr=(n==="Sole"||n==="Luna")?7:(n==="Giove")?5:4;
    const gg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr*3);
    gg.addColorStop(0,col);gg.addColorStop(0.3,col+"80");gg.addColorStop(1,col+"00");
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p.x,p.y,rr*3,0,7);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,7);ctx.fill();
    ctx.fillStyle="rgba(255,240,200,0.85)";ctx.font="12px -apple-system,sans-serif";
    ctx.fillText(n,p.x+rr+4,p.y+4);
  }
}


function disegnaSatelliti(){
  if(!SATELLITI||!SATELLITI.length)return;
  ctx.save();
  for(const s of SATELLITI){
    const r=s.calcPos(); if(!r||!r.satAltAz)continue;
    const aa=r.satAltAz;
    if(aa.alt<0)continue;  // sotto orizzonte: non visibile
    const p=proietta(aa.az,aa.alt);
    if(!p||p.x<0||p.x>W||p.y<0||p.y>H)continue;
    // satellite = puntino che si muove, con scia
    ctx.fillStyle="rgba(120,255,180,0.9)";
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill();
    if(campo<60){ctx.fillStyle="rgba(120,255,180,0.6)";ctx.font="9px monospace";
      ctx.fillText(s.nome.slice(0,12),p.x+5,p.y+3);}
  }
  ctx.restore();
}

function disegnaOrizzonte(){
  const pts=[];
  for(let az=0;az<=360;az+=2){const p=proietta(az,0);if(p)pts.push(p);}
  if(pts.length){
    // terreno semi-trasparente: riferimento ma lascia intravedere gli oggetti sotto (vista 360)
    ctx.fillStyle="rgba(8,14,26,0.45)";ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);for(const p of pts)ctx.lineTo(p.x,p.y);
    ctx.lineTo(pts[pts.length-1].x,H+5);ctx.lineTo(pts[0].x,H+5);ctx.closePath();ctx.fill();
    // linea orizzonte marcata (il riferimento principale)
    ctx.strokeStyle="rgba(110,150,170,0.7)";ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);for(const p of pts)ctx.lineTo(p.x,p.y);ctx.stroke();
  }
  const card=[[0,"N"],[90,"E"],[180,"S"],[270,"O"]];
  ctx.font="bold 16px -apple-system,sans-serif";ctx.textAlign="center";
  for(const[az,l]of card){const p=proietta(az,2.5);
    if(p&&p.x>0&&p.x<W){ctx.fillStyle="rgba(130,190,170,0.8)";ctx.fillText(l,p.x,p.y);}}
  ctx.textAlign="left";
}


// pannello indicazioni testuali "destra/sinistra alza/abbassa di tot gradi"
function disegnaIndicazioni(dAz, dAlt, scarto){
  const cx=W/2;
  const y0=H-170;  // sopra la barra di navigazione
  ctx.save();
  // sfondo box
  ctx.fillStyle="rgba(10,18,40,0.82)";
  ctx.strokeStyle="rgba(120,160,230,0.4)";ctx.lineWidth=1;
  roundRect(cx-140,y0,280,86,14);ctx.fill();ctx.stroke();
  // direzione orizzontale
  const dirAz = dAz>=0 ? "→ DESTRA" : "← SINISTRA";
  const dirAlt = dAlt>=0 ? "↑ ALZA" : "↓ ABBASSA";
  ctx.textAlign="center";
  ctx.fillStyle="#ffce8a";ctx.font="bold 20px -apple-system,sans-serif";
  ctx.fillText(dirAz+"  "+Math.abs(Math.round(dAz))+"°",cx,y0+30);
  ctx.fillText(dirAlt+"  "+Math.abs(Math.round(dAlt))+"°",cx,y0+58);
  // distanza totale
  ctx.fillStyle="rgba(180,200,240,0.7)";ctx.font="12px -apple-system,sans-serif";
  ctx.fillText("distanza "+scarto.toFixed(1)+"° — muovi il telescopio",cx,y0+78);
  ctx.textAlign="left";ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

// ---------- FRECCIA DI PUNTAMENTO SULLA MAPPA (3 stati) ----------
// Il CENTRO della mappa = dove punta il telescopio.
// Stato 1: oggetto fuori vista -> freccia al bordo
// Stato 2: oggetto sullo schermo ma non centrato -> freccia corta dal centro + gradi
// Stato 3: oggetto vicino al centro (puntato) -> cerchio "CENTRATO"
function disegnaFrecciaTarget(){
  const aa=altAzOggetto(oggettoTarget);if(!aa)return;
  // scarto angolare tra dove punta il telescopio (centro vista) e l'oggetto
  let dAz=aa.az-viewAz;while(dAz>180)dAz-=360;while(dAz<-180)dAz+=360;
  const dAlt=aa.alt-viewAlt;
  const scarto=Math.sqrt(dAz*dAz+dAlt*dAlt);  // gradi dal centro
  const p=proietta(aa.az,aa.alt);
  const dentroSchermo = p && p.x>10 && p.x<W-10 && p.y>10 && p.y<H-10;
  const SOGLIA_CENTRATO=2.0;  // gradi: entro questo = puntato davvero

  const cx=W/2, cy=H/2;

  if(scarto<=SOGLIA_CENTRATO && dentroSchermo){
    // STATO 3: CENTRATO - sei puntato sull'oggetto
    ctx.save();
    const t=Date.now()/350;
    const r=16+Math.sin(t)*2;
    ctx.strokeStyle="#22dd66";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x,p.y-r-7);ctx.lineTo(p.x,p.y-r+1);
    ctx.moveTo(p.x,p.y+r-1);ctx.lineTo(p.x,p.y+r+7);
    ctx.moveTo(p.x-r-7,p.y);ctx.lineTo(p.x-r+1,p.y);
    ctx.moveTo(p.x+r-1,p.y);ctx.lineTo(p.x+r+7,p.y);ctx.stroke();
    ctx.fillStyle="#22dd66";ctx.font="bold 14px -apple-system,sans-serif";ctx.textAlign="center";
    ctx.fillText("● "+oggettoTarget.nome+" — CENTRATO",p.x,p.y-r-14);
    ctx.textAlign="left";ctx.restore();
  }
  else if(dentroSchermo && aa.alt>-2){
    // STATO 2: sullo schermo ma non centrato - indicazioni testuali pratiche
    ctx.save();
    // evidenzio l'oggetto con cerchietto ambra
    ctx.strokeStyle="rgba(255,176,56,0.9)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,11,0,7);ctx.stroke();
    ctx.fillStyle="rgba(255,200,120,0.95)";ctx.font="bold 13px -apple-system,sans-serif";ctx.textAlign="center";
    ctx.fillText(oggettoTarget.nome,p.x,p.y-16);
    ctx.restore();
    // indicazioni testuali su come muovere il telescopio (dAz, dAlt sono già calcolati)
    disegnaIndicazioni(dAz, dAlt, scarto);
  }
  else{
    // STATO 1: fuori vista - freccia al bordo verso la direzione
    const ang=Math.atan2(-dAlt,dAz);
    const R=Math.min(W,H)*0.30;
    const x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
    ctx.save();
    ctx.translate(x,y);ctx.rotate(ang);
    ctx.fillStyle=aa.alt<0?"rgba(255,140,60,0.9)":"#22dd66";
    ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-11,-12);ctx.lineTo(-4,0);ctx.lineTo(-11,12);ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle=aa.alt<0?"rgba(255,160,80,0.95)":"rgba(120,240,150,0.95)";
    ctx.font="bold 13px -apple-system,sans-serif";ctx.textAlign="center";
    let et=oggettoTarget.nome+"  "+Math.round(scarto)+"°";
    if(aa.alt<0)et+=" (sotto orizzonte)";
    ctx.fillText(et,cx+Math.cos(ang)*(R-30),cy+Math.sin(ang)*(R-30));
    ctx.textAlign="left";ctx.restore();
  }
}

// ============================================================
//   INTERAZIONE - touch, esplora libero, bussola
// ============================================================
let drag=false,lx,ly,moved=false,pinch=0,ultimoTouch=0;

function giu(x,y){drag=true;moved=false;lx=x;ly=y;}
function muovi(x,y){if(!drag)return;const dx=x-lx,dy=y-ly;
  if(Math.abs(dx)+Math.abs(dy)>4){moved=true;
    // appena trascino: passo a esplora libero
    if(seguiTelescopio){seguiTelescopio=false;aggiornaBussola();}
    ultimoTouch=Date.now();
  }
  viewAz-=dx*campo/W*0.9;viewAlt+=dy*campo/H*0.9;
  viewAlt=Math.max(-90,Math.min(90,viewAlt));viewAz=n360(viewAz);
  lx=x;ly=y;}
function su(x,y){
  if(drag&&!moved){
    // tocco: cerca oggetto vicino (stella, poi nome costellazione, poi pianeta/messier)
    tocca(x,y);
  }
  drag=false;pinch=0;
}

function tocca(x,y){
  // stella
  let vic=null,dm=26;
  for(const ss of stelleSchermo){const d=Math.hypot(ss.x-x,ss.y-y);if(d<dm){dm=d;vic=ss.s;}}
  if(vic){ apriSchedaStella(vic); return; }
  // nome costellazione
  let vc=null,dc=42;
  for(const nc of nomiCostSchermo){const d=Math.hypot(nc.x-x,nc.y-y);if(d<dc){dc=d;vc=nc.id;}}
  if(vc){ apriSchedaCost(vc); return; }
  // altrimenti niente
}

cv.addEventListener("touchstart",e=>{if(e.touches.length===1)giu(e.touches[0].clientX,e.touches[0].clientY);
  else if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:false});
cv.addEventListener("touchmove",e=>{e.preventDefault();
  if(e.touches.length===1)muovi(e.touches[0].clientX,e.touches[0].clientY);
  else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch>0){campo*=pinch/d;campo=Math.max(12,Math.min(110,campo));}pinch=d;ultimoTouch=Date.now();}},{passive:false});
cv.addEventListener("touchend",e=>{const t=e.changedTouches[0];su(t.clientX,t.clientY);},{passive:false});
cv.addEventListener("mousedown",e=>giu(e.clientX,e.clientY));
cv.addEventListener("mousemove",e=>muovi(e.clientX,e.clientY));
cv.addEventListener("mouseup",e=>su(e.clientX,e.clientY));
cv.addEventListener("wheel",e=>{campo*=e.deltaY>0?1.1:0.9;campo=Math.max(12,Math.min(110,campo));},{passive:true});

//   MENU CATEGORIE + RICERCA GLOBALE
// ============================================================
const CATEGORIE=[
  {id:"pianeti", nome:"Pianeti", ic:"🪐"},
  {id:"stelle", nome:"Stelle", ic:"⭐"},
  {id:"costellazioni", nome:"Costellazioni", ic:"✨"},
  {id:"nebulose", nome:"Nebulose e galassie", ic:"🌌"},
  {id:"satelliti", nome:"Satelliti", ic:"🛰️"},
  {id:"sciami", nome:"Sciami meteorici", ic:"☄️"},
];

function costruisciCategorie(){
  const g=document.getElementById("catGriglia");g.innerHTML="";
  const conteggi={pianeti:PIANETI.length,stelle:Object.keys(STELLE_NOME).length,
    costellazioni:88,nebulose:(NGC?NGC.length:MESSIER.length),
    satelliti:(SATELLITI?SATELLITI.length:"?"),sciami:SCIAMI.length};
  CATEGORIE.forEach(c=>{
    const d=document.createElement("div");d.className="cat";
    d.innerHTML=`<div class="ic">${c.ic}</div><div class="nome">${c.nome}</div><div class="conta">${conteggi[c.id]}</div>`;
    d.onclick=()=>mostraCategoria(c.id);
    g.appendChild(d);
  });
}

// costruisce la lista di oggetti di una categoria
function oggettiCategoria(cat){
  let arr=[];
  if(cat==="pianeti") arr=PIANETI.map(n=>({tipo:"pianeta",nome:n}));
  else if(cat==="stelle") arr=STELLE.filter(s=>s[4]).sort((a,b)=>a[2]-b[2])
    .map(s=>({tipo:"stella",nome:s[4],ar:s[0],dec:s[1],mag:s[2],con:s[5],dist:s[6],sp:s[7]}));
  else if(cat==="costellazioni") arr=Object.keys(COST_INFO)
    .map(id=>({tipo:"costellazione",id,nome:COST_INFO[id].it,ar:COST_INFO[id].ra,dec:COST_INFO[id].dec}))
    .sort((a,b)=>a.nome.localeCompare(b.nome));
  else if(cat==="nebulose"){
    const src=NGC||MESSIER;
    arr=src.map(m=>({tipo:"nebulosa",nome:m[3],ar:m[0],dec:m[1],mag:m[2],sottotipo:m[4]||""}))
      .sort((a,b)=>(a.mag||99)-(b.mag||99));
  }
  else if(cat==="satelliti") arr=(SATELLITI||[]).map(s=>({tipo:"satellite",nome:s.nome,calcPos:s.calcPos}));
  else if(cat==="sciami") arr=SCIAMI.map(s=>({tipo:"sciame",nome:s[0],ar:s[1],dec:s[2],picco:s[3],note:s[4]}));
  return arr;
}

function mostraCategoria(cat){
  const arr=oggettiCategoria(cat);
  mostraListaOggetti(arr, CATEGORIE.find(c=>c.id===cat).nome);
}

// ricerca globale in TUTTE le categorie
function ricercaGlobale(q){
  q=q.toLowerCase().trim();
  if(!q){ document.getElementById("catGriglia").classList.remove("nascosto");
    document.getElementById("catLista").classList.add("nascosto"); return; }
  let ris=[];
  for(const cat of CATEGORIE.map(c=>c.id)){
    for(const o of oggettiCategoria(cat)){
      if(o.nome.toLowerCase().includes(q)) ris.push(o);
      if(ris.length>200) break;
    }
  }
  mostraListaOggetti(ris, "Risultati per '"+q+"'");
}

function mostraListaOggetti(arr, titolo){
  document.getElementById("catGriglia").classList.add("nascosto");
  const l=document.getElementById("catLista");l.classList.remove("nascosto");l.innerHTML="";
  if(!arr.length){ l.innerHTML='<div class="voce"><span class="n" style="color:#5a6a85">nessun risultato</span></div>'; return; }
  for(const o of arr){
    const e=eqOggetto(o);
    let vis=true, extra="";
    if(e && o.tipo!=="costellazione"){ const aa=eqAA(e.ar,e.dec); vis=aa.alt>0;
      extra=vis?(Math.round(aa.alt)+"° sopra"):"sotto orizzonte"; }
    if(o.tipo==="costellazione"){ const aa=eqAA(o.ar,o.dec); vis=aa.alt>0; extra=vis?"visibile":"non visibile"; }
    const div=document.createElement("div");
    div.className="voce"+(vis?"":" nonvis");
    let meta=extra;
    if(o.mag!=null&&o.mag<90) meta="mag "+o.mag+(extra?" · "+extra:"");
    div.innerHTML=`<span class="n">${o.nome}</span><span class="meta">${meta}</span>`;
    div.onclick=()=>apriSchedaGenerica(o);
    l.appendChild(div);
  }
}

function apriSchedaStella(s){

    ci:s[3],con:s[5],dist:s[6],sp:s[7]});

function apriSchedaCost(id){
  const c=COST_INFO[id];
  apriSchedaGenerica({tipo:"costellazione",id,nome:c.it,ar:c.ra,dec:c.dec});

function apriSchedaGenerica(o){
  const body=document.getElementById("schedaBody");
  const aa=altAzOggetto(o);
  const vis=aa&&aa.alt>0;
  let colore="#8ab4ff";
  if(o.tipo==="stella"&&o.ci!=null){const[r,g,b]=coloreStella(o.ci);colore=`rgb(${r},${g},${b})`;}
  if(o.tipo==="pianeta")colore="#ffcc88";
  if(o.tipo==="nebulosa")colore="#78c8b4";

  let sottotitolo={stella:"stella",pianeta:"pianeta",costellazione:"costellazione",
    nebulosa:"oggetto del profondo cielo",satellite:"satellite",sciame:"sciame meteorico"}[o.tipo]||"";

  let boxes="";
  if(aa){
    boxes+=`<div class="box"><div class="et">Direzione</div><div class="val">Az ${Math.round(aa.az)}°</div></div>`;
    boxes+=`<div class="box"><div class="et">Altezza</div><div class="val">${Math.round(aa.alt)}°${vis?"":" (sotto)"}</div></div>`;
  }
  if(o.mag!=null&&o.mag<90) boxes+=`<div class="box"><div class="et">Magnitudine</div><div class="val">${o.mag}</div></div>`;
  if(o.dist) boxes+=`<div class="box"><div class="et">Distanza</div><div class="val">${o.dist} a.l.</div></div>`;
  if(o.sp) boxes+=`<div class="box"><div class="et">Spettro</div><div class="val">${o.sp}</div></div>`;
  if(o.con) boxes+=`<div class="box"><div class="et">Costellazione</div><div class="val">${NOMI_COST[o.con]||o.con}</div></div>`;
  if(o.tipo==="costellazione"){const c=COST_INFO[o.id];
    if(c){ boxes+=`<div class="box full"><div class="et">Descrizione</div><div class="val" style="font-size:13px">${c.desc}</div></div>`;
      if(c.stelle)boxes+=`<div class="box full"><div class="et">Stelle principali</div><div class="val" style="font-size:14px">${c.stelle}</div></div>`;
      if(c.note)boxes+=`<div class="box full"><div class="et">Da osservare</div><div class="val" style="font-size:13px">${c.note}</div></div>`;
      if(c.stag)sottotitolo=c.lat+" · "+c.stag;
    }}
  if(o.tipo==="sciame"){ boxes+=`<div class="box full"><div class="et">Picco</div><div class="val">${o.picco}</div></div>`;
    boxes+=`<div class="box full"><div class="et">Note</div><div class="val" style="font-size:13px">${o.note}</div></div>`; }
  if(o.tipo==="nebulosa"&&o.sottotipo){const tn={gc:"ammasso globulare",oc:"ammasso aperto",
    g:"galassia",gg:"galassia",pn:"nebulosa planetaria",snr:"resto di supernova",bn:"nebulosa",en:"nebulosa"};
    sottotitolo=tn[o.sottotipo]||sottotitolo;}

  body.innerHTML=`
    <div class="head"><span class="pall" style="background:${colore};color:${colore}"></span>
      <span class="nome">${o.nome}</span></div>
    <div class="sotto">${sottotitolo}${vis?"":" · attualmente non visibile"}</div>
    <div class="griglia">${boxes}</div>
    <div class="azioni">
      <button onclick='puntaOggetto(${JSON.stringify(JSON.stringify(o))})'>🎯 Punta sulla mappa</button>
    </div>`;
  apriPannello("panScheda");
}

//   ALLINEAMENTO
// ============================================================
let ALLINEA_LISTA=[];
let oggAllinea="Luna";
const NOMI_STELLE_IT={'Sirius':'Sirio','Arcturus':'Arturo','Procyon':'Procione','Pollux':'Polluce','Castor':'Castore','Regulus':'Regolo','Polaris':'Stella Polare'};

function costruisciAllinea(){
  const consigl=[["Luna","Luna ⭐"],["Giove","Giove ⭐"],["Venere","Venere ⭐"],["Vega","Vega ⭐"],["Arcturus","Arturo ⭐"],["Capella","Capella ⭐"],["Altair","Altair ⭐"]];
  const altri=[["Sole","Sole"],["Mercurio","Mercurio"],["Marte","Marte"],["Saturno","Saturno"],["Urano","Urano"],["Nettuno","Nettuno"]];
  const stelle=STELLE.filter(s=>s[4]).sort((a,b)=>a[2]-b[2]);
  for(const s of stelle){ if(!consigl.find(c=>c[0]===s[4])) altri.push([s[4],NOMI_STELLE_IT[s[4]]||s[4]]); }
  ALLINEA_LISTA=consigl.concat([["","─── tutti gli altri ───"]]).concat(altri);
  renderAllinea();
}
function renderAllinea(filtro){
  const c=document.getElementById("listaAllinea");c.innerHTML="";
  const q=(filtro||"").toLowerCase();
  for(const[val,lab]of ALLINEA_LISTA){
    if(val===""){ if(q)continue; const d=document.createElement("div");d.className="sez";d.innerText=lab;c.appendChild(d);continue;}
    if(q&&!lab.toLowerCase().includes(q))continue;
    const d=document.createElement("div");d.className="voce"+(val===oggAllinea?"":"");
    d.innerHTML=`<span class="n">${lab}</span>`;
    d.onclick=()=>{oggAllinea=val;allineaSu(val);};
    c.appendChild(d);
  }
}
function allineaSu(nome){
  if(azF==null||altF==null){toast("sensori non pronti");return;}
  let e=null;
  if(ELEM[nome]||nome==="Luna"||nome==="Sole") e=eqPianeta(nome);
  else if(STELLE_NOME[nome]) e={ar:STELLE_NOME[nome][0],dec:STELLE_NOME[nome][1]};
  if(!e){toast("oggetto non trovato");return;}
  const aa=eqAA(e.ar,e.dec);
  if(aa.alt<0){toast(nome+" è sotto l'orizzonte");return;}
  guadAz=1;offAz=n360(aa.az-azF);if(offAz>180)offAz-=360;
  offAlt=aa.alt-altF;
  punto1={azG:azF,altG:altF,azV:aa.az,altV:aa.alt};
  toast("allineato su "+nome+" ✓");
  chiudiPannelli();
}

function toast(msg){
  const h=document.getElementById("hint");h.innerText=msg;h.style.opacity="1";
  setTimeout(()=>h.style.opacity="0",2500);
}

async function scaricaStelle(){
  const el=document.getElementById("statoDl");el.innerText="scarico...";
  try{
    let c=null;try{c=localStorage.getItem("stelle8");}catch(e){}
    if(c){STELLE_EXTRA=JSON.parse(c);el.innerText="caricate da cache: "+STELLE_EXTRA.length;return;}
    const r=await fetch("https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/stars.8.json");
    const gj=await r.json();
    STELLE_EXTRA=gj.features.map(f=>{const c=f.geometry.coordinates,p=f.properties;
      return[+(c[0]/15).toFixed(4),+(c[1]).toFixed(3),parseFloat(p.mag)||9,parseFloat(p.bv)||0.5,"",""];});
    el.innerText=STELLE_EXTRA.length+" stelle ✓";
    try{localStorage.setItem("stelle8",JSON.stringify(STELLE_EXTRA));}catch(e){el.innerText+=" (cache piena)";}
  }catch(e){el.innerText="errore: serve internet";}
}

async function scaricaSatelliti(){
  const el=document.getElementById("statoSat");el.innerText="scarico dati orbitali...";
  try{
    // Celestrak in formato TLE (2 righe per satellite)
    const r=await fetch("https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle");
    const txt=await r.text();
    const righe=txt.split(/\r?\n/).filter(x=>x.trim());
    SATELLITI=[];
    for(let i=0;i+2<righe.length;i+=3){
      const nome=righe[i].trim(), l1=righe[i+1], l2=righe[i+2];
      if(l1[0]!=="1"||l2[0]!=="2")continue;
      SATELLITI.push({nome, l1, l2,
        calcPos:function(){ return calcolaSatellite(this.l1,this.l2); }});
    }
    el.innerText=SATELLITI.length+" satelliti ✓";
    try{localStorage.setItem("sat_tle",txt);}catch(e){}
  }catch(e){el.innerText="errore: serve internet per i satelliti";}
}
// calcolo posizione satellite con SGP4 -> ritorna {ar,dec} per uniformità
function calcolaSatellite(l1,l2){
  if(lat==null)return null;
  try{
    const r=SGP4.posizione(l1,l2,lat,lon,new Date());
    // converto alt/az del satellite in ar/dec fittizi per il sistema di puntamento
    // (il resto dell'app lavora in ar/dec; qui e' piu' diretto restituire alt/az)
    return {satAltAz:{alt:r.alt,az:r.az,range:r.range}};
  }catch(e){return null;}
}
